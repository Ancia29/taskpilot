
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPilot AI | Sign In</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid;
            place-items: center; font-family: Arial, sans-serif;
            background: #f3f5fa; color: #17233c;
        }
        .login-card {
            width: min(400px, 92%); padding: 36px;
            background: white; border: 1px solid #e4e8f0;
            border-radius: 18px; box-shadow: 0 18px 55px #17233c12;
        }
        .logo { color: #315bea; font-size: 27px; font-weight: bold; }
        h1 { margin-bottom: 8px; font-size: 25px; }
        p { color: #69758b; line-height: 1.5; }
        label { display: block; margin: 20px 0 8px; font-size: 14px; }
        input {
            width: 100%; padding: 13px; border: 1px solid #d9dfeb;
            border-radius: 8px; font-size: 15px;
        }
        button {
            width: 100%; margin-top: 22px; padding: 14px;
            border: 0; border-radius: 8px; background: #315bea;
            color: white; font-size: 15px; font-weight: bold; cursor: pointer;
        }
        #message { font-size: 14px; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="logo">TaskPilot AI</div>
        <h1>Welcome back</h1>
        <p>Sign in to access your management workspace.</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input id="email" type="email" required
                   autocomplete="username"
                   placeholder="Enter your email">

            <label for="password">Password</label>
            <input id="password" type="password" required
                   autocomplete="current-password"
                   placeholder="Enter your password">

            <button type="submit">Sign in</button>
            <p id="message" role="status"></p>
        </form>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit",
            async function(event) {
                event.preventDefault();
                const message = document.getElementById("message");
                message.textContent = "Signing in...";

                try {
                    const csrfResponse = await fetch("/auth/csrf");
                    if (!csrfResponse.ok) throw new Error("Could not start sign-in.");
                    const csrf = await csrfResponse.json();

                    const response = await fetch("/auth/login", {
                        method: "POST",
                        credentials: "same-origin",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": csrf.token
                        },
                        body: JSON.stringify({
                            email: document.getElementById("email").value.trim(),
                            password: document.getElementById("password").value
                        })
                    });

                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.error || "Sign-in failed.");
                    }

                    if (result.role !== "manager") {
                        await fetch("/auth/logout", {
                            method: "POST",
                            headers: { "X-CSRFToken": csrf.token },
                            credentials: "same-origin"
                        });
                        throw new Error("This page is for managers.");
                    }

                    window.location.href = "/dashboard";
                } catch (error) {
                    message.textContent = error.message;
                }
            });
    </script>
</body>
</html>
